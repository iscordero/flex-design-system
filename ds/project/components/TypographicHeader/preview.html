<!-- @dsCard group="Page modules · Heroes and headers" height=1250 width=1440 subtitle="Block module · A section opener with no media: left-aligned and centred, then both on mobile." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TypographicHeader — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--surface-neutral-100)}.cap{padding:var(--spacing-xl) var(--spacing-xl) var(--spacing-xs);font-family:var(--font-heading);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}.phones{display:flex;align-items:flex-start;gap:var(--spacing-xl);padding:0 var(--spacing-xl) var(--spacing-xl)}.phone{flex:none;width:375px;box-shadow:var(--shadow-card)}.phone .cap{padding:0 0 var(--spacing-xs);background:var(--surface-neutral-100)}.tablet{width:834px;margin:0 var(--spacing-xl) var(--spacing-xl);box-shadow:var(--shadow-card)}</style>
</head>
<body>
<div id="root"></div>
<script>
var Q = window.Qualys, h = React.createElement;
function cap(t) { return h('div', {className: 'cap'}, t); }
function phone(t, node) { return h('div', null, cap(t).props.children ? h('div', {className: 'cap', style: {paddingLeft: 0}}, t) : null, h('div', {className: 'phone'}, node)); }
var P = {eyebrow: 'Lorem Ipsum Dolor', title: 'Lorem Ipsum Dolor Sit Amet Consectetur Ut Gravida Senectus Diam Quam Ipsum Odio Vestibulum', body: 'Lorem ipsum dolor sit amet consectetur. Interdum natoque ullamcorper elit ipsum duis aenean neque sed volutpat facilisis.'};
function hd(extra) { return h(Q.TypographicHeader, Object.assign({}, P, {actions: [h(Q.Button, {key: 'p'}, 'Primary Button'), h(Q.Button, {key: 's', variant: 'secondary'}, 'Secondary Button')]}, extra)); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
  cap('Left-aligned'), hd(),
  cap('Centred'), hd({align: 'center'}),
  cap('Mobile'), h('div', {className: 'phones'}, h('div', {className: 'phone'}, hd()), h('div', {className: 'phone'}, hd({align: 'center'})))));
</script>
</body>
</html>
