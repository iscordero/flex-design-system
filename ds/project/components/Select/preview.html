<!-- @dsCard group="Components · Inputs" height=323 width=1100 subtitle="Component · Form dropdown: placeholder, chosen value, error, open with a chosen row" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--surface-neutral-100)}.pv{padding:var(--spacing-xl);display:flex;flex-direction:column;gap:var(--spacing-rg)}.row{display:flex;gap:var(--spacing-xl);align-items:flex-start;flex-wrap:wrap}.cap{margin-bottom:var(--spacing-3xs);font-family:var(--font-heading);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}.col{display:flex;flex-direction:column;gap:var(--spacing-rg);width:320px}</style>
</head>
<body>
<div id="root"></div>
<script>
var Q = window.Qualys, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className: 'pv'}, h('div', {className: 'row'},
  h('div', {className: 'col'}, h('div', {className: 'cap'}, 'Default'),
    h(Q.Select, {label: 'Placeholder Label', options: ['Item Name', 'Item Name 2', 'Item Name 3']}),
    h(Q.Select, {label: 'Label', options: ['Item Name', 'Item Name 2', 'Item Name 3'], defaultValue: 'Item Name'})),
  h('div', {className: 'col'}, h('div', {className: 'cap'}, 'Error'),
    h(Q.Select, {label: 'Placeholder Label', options: ['Item Name'], error: 'This field is required'})),
  h('div', {className: 'col'}, h('div', {className: 'cap'}, 'Open'),
    h(Q.Select, {label: 'Label', defaultOpen: true, defaultValue: 'Item Name 2', options: ['Item Name 1', 'Item Name 2', 'Item Name 3', 'Item Name 4', 'Item Name 5']}))
)));
</script>
</body>
</html>
