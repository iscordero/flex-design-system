<body>

<script>

var LOGO = '/_blob/a0d4062abbce2ceb87d5be08d326359f', SHIELD = '/_blob/1317004b4eea94a3648caf5ff41b1862';

function L(label, href) { return {label: label, href: href.charAt(0) === '/' ? W + href : href}; }

  {title: 'Segments', links: [L('Small Business', '/subscriptions/smb'), L('Mid-Sized Business', '/subscriptions/sme'), L('Enterprise', '/subscriptions/enterprise'), 'Public Sector']}]};

var RESOURCES = {columns: [

/* Links to qualys.com open in a new tab, so the preview stays put. */
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href^="http"]');
  if (a) { e.preventDefault(); window.open(a.href, '_blank', 'noopener'); }

  h('div', {className: 'cap'}, 'Desktop \u00b7 Customers'),
  h('div', {className: 'stage s4'}, nav({layout: 'desktop', hover: false, defaultOpen: 2})),
  h('div', {className: 'cap'}, 'Desktop \u00b7 Resources'),
  h('div', {className: 'stage s5'}, nav({layout: 'desktop', hover: false, defaultOpen: 3})),
  h('div', {className: 'cap'}, 'Desktop \u00b7 Support'),
  h('div', {className: 'stage s6'}, nav({layout: 'desktop', hover: false, defaultOpen: 4})),
  h('div', {className: 'cap'}, 'Desktop \u00b7 More: Partners and Company together'),
  h('div', {className: 'stage s7'}, nav({layout: 'desktop', hover: false, defaultOpen: 5})),

    h('div', {className: 'phone phone--tall'}, nav({layout: 'mobile', inlinePanel: true, defaultPath: [0]})),
    h('div', {className: 'phone phone--tall'}, nav({layout: 'mobile', inlinePanel: true, defaultPath: [0, 'all']})))));
</script>
