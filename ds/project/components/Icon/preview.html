<!-- @dsCard group="Guidelines · Icons and logos" height=5216 width=1180 subtitle="Component · Five sizes with their stroke weights, three approved colours, the Hugeicons library and the Qualys utility icons" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--surface-neutral-200)}
.pv{padding:var(--spacing-2xl) var(--spacing-4xl) var(--spacing-4xl)}
.sec{margin-top:var(--spacing-5xl)}.sec:first-child{margin-top:0}
.sec__title{margin:0;font-family:var(--font-heading);font-weight:600;font-size:38px;line-height:1.1;letter-spacing:-0.02em}
.sec__lede{margin:var(--spacing-xs) 0 0;max-width:780px;font-size:18px;line-height:1.3;letter-spacing:-0.01em;color:var(--text-secondary)}
.sec__lede a{color:var(--hyperlink-default);font-weight:600}
.panel{margin-top:var(--spacing-xl);border:1px solid var(--stroke-neutral-400);border-radius:var(--radius-md);background:var(--surface-neutral-100);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.3}
th{padding:var(--spacing-xs) var(--spacing-rg);text-align:left;font-family:var(--font-heading);font-weight:600;font-size:13px;color:var(--text-secondary);background:var(--surface-neutral-300)}
td{padding:var(--spacing-rg);border-top:1px solid var(--stroke-neutral-400);vertical-align:middle}
td:first-child{font-family:var(--font-heading);font-weight:600;font-size:16px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;color:var(--cobalt)}
.spec{display:flex;align-items:center;gap:var(--spacing-rg);color:var(--icon-default)}
.tones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tone{padding:var(--spacing-xl);display:flex;flex-direction:column;gap:var(--spacing-rg)}
.tone+.tone{border-left:1px solid var(--stroke-neutral-400)}
.tone.is-dark{background:var(--surface-neutral-600);color:var(--text-inverted)}
.tone.is-blue{background:var(--surface-blue-200)}
.tone b{font-family:var(--font-heading);font-weight:600;font-size:18px}
.tone p{margin:0;font-size:14px;line-height:1.3;color:var(--text-secondary)}
.tone.is-dark p,.tone.is-dark code{color:var(--stroke-neutral-400)}
.tone .row{display:flex;gap:var(--spacing-rg);align-items:center}
.set{margin-top:var(--spacing-xl)}
.set__head{display:flex;align-items:baseline;gap:var(--spacing-xs);margin-bottom:var(--spacing-xs)}
.set__head b{font-family:var(--font-heading);font-weight:600;font-size:24px;letter-spacing:-0.02em}
.set__head span{font-size:14px;color:var(--text-secondary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:var(--spacing-5xs);padding:var(--spacing-rg);border:1px solid var(--stroke-neutral-400);border-radius:var(--radius-md);background:var(--surface-neutral-100)}
.cell{display:flex;flex-direction:column;align-items:center;gap:var(--spacing-3xs);padding:var(--spacing-xs) var(--spacing-5xs);border-radius:var(--radius-rg);color:var(--icon-default)}
.cell:hover{background:var(--surface-blue-100)}
.nm{max-width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.25;color:var(--text-secondary);text-align:center;overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="root"></div>
<script>
var Q = window.Qualys, h = React.createElement;
var SAMPLE = ['hi:alert-01', 'hi:arrow-right-02', 'hi:bookmark-02', 'hi:ai-brain-01', 'hi:add-circle', 'hi:notification-01'];
var SIZES = [
  ['xs', '12px', '1px', 'Next to 12px text and in tight spots: breadcrumb separators, the small checkbox tick, the cross on small chips.'],
  ['sm', '16px', '1.25px', 'The default, next to 14–16px text: button and link arrows, inputs, chevrons, search, the nav menu arrows, toasts.'],
  ['md', '20px', '1.5px', 'Controls that stand alone, next to 18–20px text: card download and outlink icons, calendar view switches.'],
  ['lg', '24px', '1.5px', 'Standalone UI icons: close buttons on dialogs and drawers, dialog status icons, event types, the social glyphs. The size Hugeicons are drawn at.'],
  ['xl', '32px', '2px', 'Feature lists, empty states and section markers. Larger illustrations use the Feature Icons, not stroke icons.']
];
function code(t) { return h('code', null, t); }
function sizes() {
  return h('div', {className: 'panel'}, h('table', null,
    h('thead', null, h('tr', null, ['Size', 'Box', 'Stroke', 'Specimen', 'Use it for'].map(function (c) { return h('th', {key: c}, c); }))),
    h('tbody', null, SIZES.map(function (s) {
      return h('tr', {key: s[0]},
        h('td', null, s[0], ' ', h('code', null, 'size="' + s[0] + '"')),
        h('td', null, s[1]), h('td', null, s[2]),
        h('td', null, h('div', {className: 'spec'}, SAMPLE.map(function (n) { return h(Q.Icon, {key: n, name: n, size: s[0]}); }))),
        h('td', null, s[3]));
    }))));
}
function tones() {
  var row = function (tone) { return h('div', {className: 'row'}, SAMPLE.map(function (n) { return h(Q.Icon, {key: n, name: n, size: 'lg', tone: tone}); })); };
  return h('div', {className: 'panel tones'},
    h('div', {className: 'tone'}, h('b', null, 'Black'), h('p', null, ['tone="black" · ', code('icon-default'), ' (Charcoal). The default on light grounds.']), row('black')),
    h('div', {className: 'tone is-blue'}, h('b', null, 'Blue'), h('p', null, ['tone="blue" · ', code('icon-feature'), ' (Qualys Blue). To draw the eye: features, links, active states. Not for body-size icons in running text.']), row('blue')),
    h('div', {className: 'tone is-dark'}, h('b', null, 'White'), h('p', null, ['tone="white" · ', code('icon-inverted'), '. On Charcoal, blue gradients and photos.']), row('white')));
}
function library() {
  return (Q.Icon.hugeicons || []).map(function (g) {
    return h('div', {key: g[0], className: 'set'},
      h('div', {className: 'set__head'}, h('b', null, g[0]), h('span', null, g[1].length + ' icons')),
      h('div', {className: 'grid'}, g[1].map(function (n) {
        return h('div', {key: n, className: 'cell', title: 'hi:' + n}, h(Q.Icon, {name: 'hi:' + n, size: 'lg'}), h('span', {className: 'nm'}, n));
      })));
  });
}
var UTIL = ['download','arrow-right','arrow-left','outlink','search','check','chevron-right','chevron-left','chevron-up','chevron-down','plus','cross','filter','menu','time','view-list','view-month','view-grid','alert-triangle','alert-circle','check-circle','x-circle','file','party','cookie','event-qualys','event-webinar','event-industry','event-speaking','event-training','general-events','general-webinar','general-resource','social-linkedin','social-x','social-facebook','social-instagram','social-vimeo','social-youtube','social-url'];
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className: 'pv'},
  h('section', {className: 'sec'}, h('h2', {className: 'sec__title'}, 'Sizes'),
    h('p', {className: 'sec__lede'}, 'Five sizes. Each sets the box and the stroke weight together, so a line stays the same weight however the icon is drawn. Pick by what the icon sits beside, not by how important it feels.'),
    sizes()),
  h('section', {className: 'sec'}, h('h2', {className: 'sec__title'}, 'Colours'),
    h('p', {className: 'sec__lede'}, 'Three approved colours. An icon takes one colour only; status icons use their status colour instead (see Toast and AlertDialog).'),
    tones()),
  h('section', {className: 'sec'}, h('h2', {className: 'sec__title'}, 'Hugeicons library'),
    h('p', {className: 'sec__lede'}, ['The stroke icon library: Hugeicons free, stroke rounded (MIT), drawn on a 24px grid. These sets are built in: ', code('name="hi:alert-01"'), '. Any other free Hugeicon works through ', code('icon'), ', imported from @hugeicons/core-free-icons. Point at an icon for its name.']),
    library()),
  h('section', {className: 'sec'}, h('h2', {className: 'sec__title'}, 'Qualys utility icons'),
    h('p', {className: 'sec__lede'}, 'The filled glyphs drawn for Qualys components: buttons, cards, events, the social links. Keep using them where a component names them.'),
    h('div', {className: 'grid', style: {marginTop: 24}}, UTIL.map(function (n) {
      return h('div', {key: n, className: 'cell'}, h(Q.Icon, {name: n, size: 24}), h('span', {className: 'nm'}, n));
    })))));
</script>
</body>
</html>
