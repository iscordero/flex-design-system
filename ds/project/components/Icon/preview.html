<!-- @dsCard group="Components · Icons, tags and flags" height=400 subtitle="Component · Utility icons, inline in currentColor" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--surface-neutral-200)}.pv{padding:var(--spacing-xl);display:flex;flex-direction:column;gap:var(--spacing-rg)}.row{display:flex;gap:var(--spacing-xs);align-items:center;flex-wrap:wrap}.lbl{min-width:150px;font-family:var(--font-heading);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}.dark{background:var(--surface-neutral-600);border-radius:var(--radius-lg);padding:var(--spacing-rg) var(--spacing-xl)}.dark .lbl{color:rgba(255,255,255,.75)}.grid{display:flex;flex-wrap:wrap;gap:var(--spacing-xs)}.cell{width:80px;display:flex;flex-direction:column;align-items:center;gap:var(--spacing-4xs)}.box{width:48px;height:48px;border-radius:var(--radius-rg);background:var(--surface-neutral-100);border:1px solid var(--stroke-neutral-400);display:flex;align-items:center;justify-content:center;color:var(--icon-default)}.nm{font-size:12px;color:var(--text-secondary)}</style>
</head>
<body>
<div id="root"></div>
<script>
var Q = window.Qualys, h = React.createElement;
var names = ['download','arrow-right','arrow-left','outlink','search','check','chevron-right','chevron-left','chevron-up','chevron-down','plus','cross','filter','menu','time','view-list','view-month','view-grid','alert-triangle','alert-circle','check-circle','x-circle','file','party','cookie','event-qualys','event-webinar','event-industry','event-speaking','event-training','general-events','general-webinar','general-resource','social-linkedin','social-x','social-facebook','social-instagram','social-vimeo','social-youtube','social-url'];
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className: 'pv'}, h('div', {className: 'grid'}, names.map(function (n) {
  return h('div', {key: n, className: 'cell'}, h('div', {className: 'box'}, h(Q.Icon, {name: n, size: 24})), h('div', {className: 'nm'}, n));
}))));
</script>
</body>
</html>
