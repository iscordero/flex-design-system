<!-- @dsCard group="Components · Overlays and messages" height=437 width=1100 subtitle="Component · A short label on hover or focus: top, bottom, left and right, dark and light. The last row is live." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tooltip — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--surface-neutral-100)}.cap{padding:var(--spacing-xl) var(--spacing-xl) var(--spacing-xs);font-family:var(--font-heading);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}.phones{display:flex;align-items:flex-start;gap:var(--spacing-xl);padding:0 var(--spacing-xl) var(--spacing-xl)}.phone{flex:none;width:375px;box-shadow:var(--shadow-card)}.phone .cap{padding:0 0 var(--spacing-xs);background:var(--surface-neutral-100)}.tablet{width:834px;margin:0 var(--spacing-xl) var(--spacing-xl);box-shadow:var(--shadow-card)}.stage{display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--spacing-xl);padding:var(--spacing-2xl) var(--spacing-xl);background:var(--surface-neutral-400)}.stage>*{flex:none}.w480{width:480px}.w540{width:540px}.w600{width:600px}.w440{width:440px}.w375{width:375px}.w351{width:351px}.full{width:100%}.tips{padding:var(--spacing-xl);display:flex;flex-direction:column;gap:var(--spacing-xs);background:var(--surface-neutral-200)}.trow{display:flex;align-items:center;gap:120px;height:110px;padding:0 100px}.cell{display:flex}.chip{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:var(--radius-rg);background:var(--surface-neutral-100);box-shadow:inset 0 0 0 1px var(--stroke-neutral-400);font-family:var(--font-heading);font-weight:600;font-size:14px}</style>
</head>
<body>
<div id="root"></div>
<script>
var Q = window.Qualys, h = React.createElement;
function cap(t) { return h('div', {className: 'cap'}, t); }
function phone(t, node) { return h('div', null, cap(t).props.children ? h('div', {className: 'cap', style: {paddingLeft: 0}}, t) : null, h('div', {className: 'phone'}, node)); }
function chip(t) { return h('span', {className: 'chip'}, t); }
function tip(pos, theme) { return h('div', {className: 'cell', key: pos + theme}, h(Q.Tooltip, {open: true, position: pos, theme: theme, label: 'Tooltip text'}, chip(pos.charAt(0).toUpperCase() + pos.slice(1)))); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className: 'tips'},
  h('div', {className: 'cap', style: {padding: 0}}, 'Dark'), h('div', {className: 'trow'}, ['top', 'bottom', 'left', 'right'].map(function (p) { return tip(p, 'dark'); })),
  h('div', {className: 'cap', style: {padding: 0}}, 'Light'), h('div', {className: 'trow'}, ['top', 'bottom', 'left', 'right'].map(function (p) { return tip(p, 'light'); })),
  h('div', {className: 'cap', style: {padding: 0}}, 'Live: point at or tab to these'), h('div', {className: 'trow', style: {height: 64}},
    h(Q.Tooltip, {label: 'Download the report as a PDF'}, h(Q.Button, {size: 'sm', variant: 'secondary', iconLeft: 'download'}, 'Download')),
    h(Q.Tooltip, {position: 'right', theme: 'light', label: 'TruRisk scores each asset from 0 to 1,000'}, 'TruRisk score'))));
</script>
</body>
</html>
