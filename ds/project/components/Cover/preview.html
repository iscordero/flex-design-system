<title>Qualys Flex Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-neutral-200); color: var(--text-primary); font-family: var(--font-heading); overflow: hidden; }
  /* The cover fills its frame. The words hold the left edge; the artwork holds the right edge (its tiles end spacing-3xl in), so a wide frame has no empty band on the right. Under 960px the artwork stays put and is cropped. */
  .cover { position: relative; height: 320px; width: 100%; min-width: 960px; overflow: hidden; }
  .art { position: absolute; top: 0; left: max(0px, calc(100% - 960px)); width: 960px; height: 320px; }
  .words { position: absolute; left: var(--spacing-3xl); top: var(--spacing-3xl); bottom: 0; width: 500px; }
  .logo { display: block; height: 64px; width: auto; }
  .tags { display: flex; margin-top: var(--spacing-2xl); }
  .name { margin: var(--spacing-xs) 0 0; font-weight: 700; font-size: 53px; line-height: 1.1; letter-spacing: -0.03em; white-space: nowrap; color: var(--text-primary); }
  .tagline { margin: var(--spacing-3xs) 0 0; font-weight: 400; font-size: 19px; line-height: 1.3; letter-spacing: -0.01em; color: var(--text-secondary); }
  .site { position: absolute; left: 0; bottom: 28px; margin: 0; font-weight: 500; font-size: 13px; line-height: 1; color: var(--text-secondary); }
  .r { rx: var(--radius-md); }
  /* Every fill is a blue from the palette, and the picture stays calm: the tiles are the two lightest blues (misty-blue, polar-blue), with qualys-blue, azul and cobalt only in the small shapes inside them and on one dark tile. No mixed tints. */
  .polar { fill: var(--polar-blue); }
  .misty { fill: var(--misty-blue); }
  .brand { fill: var(--qualys-blue); }
  .azul { fill: var(--azul); }
  .deep { fill: var(--cobalt); }
  .signal { fill: var(--qualys-red); }
  .paper { fill: var(--surface-neutral-100); }
  .aa { font-family: var(--font-heading); font-weight: 700; font-size: 62px; letter-spacing: -0.02em; }
  .hit { fill: none; pointer-events: all; }
  .move, .knob { transition: transform 300ms ease-in-out; }
  .tile:hover .move { transform: translateY(calc(var(--spacing-5xs) * -1)); }
  .toggle:hover .knob { transform: translateX(-48px); }
  @media (prefers-reduced-motion: reduce) { .move, .knob { transition: none; } .tile:hover .move, .toggle:hover .knob { transform: none; } }
</style>
</head>

  arrangement three rows (100, 68, 78 tall) of three unequal tiles, spacing-4xs gutters, inset spacing-3xl from the right edge; the grid follows the right edge of the frame at any width from 960px up
