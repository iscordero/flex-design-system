<!-- @dsCard group="Page modules · Tables" height=4475 width=1440 subtitle="Block module · A branded table: photo header, Feature Icon row headings, one featured column. Charcoal, tablet, mobile." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MarketingTable — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--surface-neutral-100)}.cap{padding:var(--spacing-xl) var(--spacing-xl) var(--spacing-xs);font-family:var(--font-heading);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}.phones{display:flex;align-items:flex-start;gap:var(--spacing-xl);padding:0 var(--spacing-xl) var(--spacing-xl)}.phone{flex:none;width:375px;box-shadow:var(--shadow-card)}.tablet{width:834px;margin:0 var(--spacing-xl) var(--spacing-xl);box-shadow:var(--shadow-card)}</style>
</head>
<body>
<div id="root"></div>
<script>
var Q = window.Qualys, h = React.createElement;
function cap(t) { return h('div', {className: 'cap'}, t); }
var CAPITOL = '/_blob/34746d9de197742e629cf55fcd5ebc07', LOGO = '/_blob/2f12addb8d68868ae064a58fad459a07';
var ICON = {
  prioritize: '/_blob/879916cd1c61396c65bde874a0e7ba08', threat: '/_blob/e594a6d966d00d9ea5bb37fd3d806358', detect: '/_blob/bdcd7cc4b2bbc39f3f0aba2ee1b6ea8e',
  vulnerability: '/_blob/2278c0ac5e6973627f979d3b3e36a0ff', measure: '/_blob/08a9d26a3a902a648c904b65297a8cb7', agentic: '/_blob/ab4c0b41714ffc1726347d4515429315'
};
/* The photo sits at 72% of the header's width (the default). `focus` centres the header on the foot of the dome, 54% of the way down the photo. */
var PHOTO = {src: CAPITOL, focus: '54%'};
/* The first column heads the rows. The Qualys column shows the reversed logo in place of a heading and is the featured one. */
var COLUMNS = [
  {title: 'CISA BOD 26-04', subtitle: 'Requirements'},
  {logo: LOGO, subtitle: 'Advantages', featured: true},
  {title: 'ROC', subtitle: 'Capabilities'}
];
/* Each row's cells follow the column order: the Qualys advantage, then the ROC capability. */
var ROWS = [
  {icon: ICON.prioritize, title: 'Risk-Based Prioritization', cells: ['Context-driven, exploitability-aware triage', 'Ranked by threat x exposure x mission impact']},
  {icon: ICON.threat, title: 'Focus on KEV and Active Threats', cells: ['Flags KEV/ named-actor weaponization in real-time', 'Integrated threat intelligence and validation']},
  {icon: ICON.detect, title: 'Continuous Assessment', cells: ['Live vulnerability graph; no scan window dependency', 'Real-time detection and monitoring']},
  {icon: ICON.vulnerability, title: 'Exploit-Validated Decisions', cells: ["TruConfirm + Agent Val prove what's reachable on your deployed controls", 'Production-safe exploitability validation']},
  {icon: ICON.measure, title: 'Demonstrable Risk Reduction', cells: ['Re-test closed paths, auditable evidence', 'Verified remediation and validation loops']},
  {icon: ICON.agentic, title: 'Operation Efficiency', cells: ['Out-of-the box agentic AI allows staff to focus on critical vulns', 'Automation and workflow integration']}
];
function plain() { return ROWS.map(function (r) { return {title: r.title, cells: r.cells}; }); }
function table(extra) {
  return h(Q.MarketingTable, Object.assign({label: 'CISA BOD 26-04 requirements, Qualys advantages and ROC capabilities', columns: COLUMNS, rows: ROWS, image: PHOTO}, extra));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
  cap('Qualys Blue header with a photo · Feature Icons · the Qualys column featured'), table(),
  cap('Charcoal header · rows without icons'), table({tone: 'dark', rows: plain()}),
  cap('Tablet'), h('div', {className: 'tablet'}, table()),
  cap('Mobile — the columns stack under each row heading'), h('div', {className: 'phones'},
    h('div', {className: 'phone'}, table()),
    h('div', {className: 'phone'}, table({tone: 'dark', rows: plain()})))));
</script>
</body>
</html>
