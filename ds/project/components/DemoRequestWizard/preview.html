<!-- @dsCard group="Components · Forms" height=1795 width=1440 subtitle="Pattern · A demo request in three working steps: contact, company, confirmation; then mobile." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DemoRequestWizard — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--surface-neutral-100)}.cap{padding:var(--spacing-xl) var(--spacing-xl) var(--spacing-xs);font-family:var(--font-heading);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}.phones{display:flex;align-items:flex-start;gap:var(--spacing-xl);padding:0 var(--spacing-xl) var(--spacing-xl)}.phone{flex:none;width:375px;box-shadow:var(--shadow-card)}.phone .cap{padding:0 0 var(--spacing-xs);background:var(--surface-neutral-100)}.tablet{width:834px;margin:0 var(--spacing-xl) var(--spacing-xl);box-shadow:var(--shadow-card)}.stage{display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--spacing-xl);padding:var(--spacing-2xl) var(--spacing-xl);background:var(--surface-neutral-400)}.stage>*{flex:none}.w480{width:480px}.w540{width:540px}.w600{width:600px}.w440{width:440px}.w375{width:375px}.w351{width:351px}.full{width:100%}</style>
</head>
<body>
<div id="root"></div>
<script>
var Q = window.Qualys, h = React.createElement;
function cap(t) { return h('div', {className: 'cap'}, t); }
function phone(t, node) { return h('div', null, cap(t).props.children ? h('div', {className: 'cap', style: {paddingLeft: 0}}, t) : null, h('div', {className: 'phone'}, node)); }
var STEPS = [
  {title: 'Request a Demo', description: 'Contact Information', fields: [{name: 'first', label: 'First Name', required: true}, {name: 'last', label: 'Last Name', required: true}, {name: 'email', label: 'Work Email', type: 'email', required: true}, {name: 'phone', label: 'Phone', type: 'tel'}]},
  {title: 'Company Details', description: 'Tell us about your organization', fields: [{name: 'company', label: 'Company Name', required: true}, {name: 'title', label: 'Job Title'}, {name: 'size', label: 'Company Size', options: ['1–99', '100–999', '1,000–9,999', '10,000+']}, {name: 'interest', label: 'Area of Interest', options: ['Vulnerability Management', 'Cloud Security', 'Compliance', 'Patch Management']}], consent: 'I would like to receive Qualys communications.'}
];
function w(step) { return h(Q.DemoRequestWizard, {inline: true, steps: STEPS, defaultStep: step}); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
  cap('Step 1 · step 2 · confirmation'), h('div', {className: 'stage'}, h('div', {className: 'w540'}, w(0)), h('div', {className: 'w540'}, w(1)), h('div', {className: 'w540'}, w(2))),
  cap('Mobile'), h('div', {className: 'stage'}, h('div', {className: 'w351'}, w(0)), h('div', {className: 'w351'}, w(1)), h('div', {className: 'w351'}, w(2)))));
</script>
</body>
</html>
