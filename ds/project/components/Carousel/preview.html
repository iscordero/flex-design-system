<!-- @dsCard group="Page modules · Carousels and logos" height=1817 width=1440 subtitle="Block module · Cards you scroll sideways, several at once or one across, with progress bar and arrows." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--surface-neutral-100)}.cap{padding:var(--spacing-xl) var(--spacing-xl) var(--spacing-xs);font-family:var(--font-heading);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}.phones{display:flex;align-items:flex-start;gap:var(--spacing-xl);padding:0 var(--spacing-xl) var(--spacing-xl)}.phone{flex:none;width:375px;box-shadow:var(--shadow-card)}.phone .cap{padding:0 0 var(--spacing-xs);background:var(--surface-neutral-100)}.tablet{width:834px;margin:0 var(--spacing-xl) var(--spacing-xl);box-shadow:var(--shadow-card)}</style>
</head>
<body>
<div id="root"></div>
<script>
var Q = window.Qualys, h = React.createElement;
function cap(t) { return h('div', {className: 'cap'}, t); }
function phone(t, node) { return h('div', null, cap(t).props.children ? h('div', {className: 'cap', style: {paddingLeft: 0}}, t) : null, h('div', {className: 'phone'}, node)); }
function res(i) { return h(Q.ResourceCard, {key: i, href: '#', external: true, flag: i === 1 ? undefined : 'Tag Text', resourceType: 'Resource Type', title: 'This is a Resource Title Lorem Ipsum Dolor', date: 'Dec 10, 2025'}); }
function ev(i) { return h(Q.EventCard, {key: i, layout: 'featured', href: '#', external: true, flag: 'Tag Text', category: 'Event Type', format: 'Event Format', title: 'This is an Event Title Lorem Ipsum Dolor', description: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris ipsum dolor sit amet, consectetur.', date: 'Dec 10, 2026 • 11a PST'}); }
function multi() { return h(Q.Carousel, {label: 'Resources'}, [0, 1, 2, 3, 4, 5].map(res)); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
  cap('Multi card'), multi(),
  cap('Single card'), h(Q.Carousel, {variant: 'single', label: 'Featured events'}, [0, 1, 2].map(ev)),
  cap('Mobile'), h('div', {className: 'phones'}, h('div', {className: 'phone'}, multi()))));
</script>
</body>
</html>
